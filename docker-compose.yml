services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: finance_flow
      POSTGRES_USER: finance_flow
      POSTGRES_PASSWORD: finance_flow
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://finance_flow:finance_flow@postgres:5432/finance_flow
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_JWT_SECRET: ${SUPABASE_JWT_SECRET:-}
      CATEGORIZATION_PROVIDER: ${CATEGORIZATION_PROVIDER:-rules}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_CATEGORIZATION_MODEL: ${OPENAI_CATEGORIZATION_MODEL:-gpt-5.6-luna}
      OPENAI_CATEGORIZATION_TIMEOUT_SECONDS: ${OPENAI_CATEGORIZATION_TIMEOUT_SECONDS:-8}
    depends_on:
      - postgres

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
